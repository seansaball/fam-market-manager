name: Tests

# Mechanical backstop for the local release audit gate
# (scripts\run_release_audit.bat).  Runs the full pytest suite plus the
# three simulation gates on every push to master so a commit that
# skipped local testing cannot sit on master undetected.
#
# Mirrors the local environment deliberately:
#   - windows-latest        (the app ships only on Windows)
#   - Python 3.12           (matches the dev + build environment)
#   - requirements-build.lock (exact pinned versions used in signed builds)
#   - pytest 9.0.2 / pytest-qt 4.5.0 (matches the dev environment)
#
# The fuzz job is blocking for NEW regressions: the known-failing
# seeds (BUGS_BACKLOG.md BUG-006) are deselected, and the standalone
# fuzz simulator runs as a soft-fail step until BUG-006 closes.
# Green fuzz job = no new fuzz failures.

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  # Headless Qt: render offscreen, no display/session dependency.
  QT_QPA_PLATFORM: offscreen

jobs:
  tests:
    name: Test suite + simulation gates
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements-build.lock

      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-build.lock
          pip install pytest==9.0.2 pytest-qt==4.5.0

      # TestAccessibilityFontSizes asserts rendered font pixel sizes,
      # which only mean anything on a real display.  The offscreen Qt
      # platform substitutes synthetic font metrics and fails all four
      # (verified 2026-06-10: 4 failed offscreen, 25/25 pass natively).
      # They remain part of the local suite and the release audit gate.
      - name: "Gate 1: pytest suite (excluding UI fuzz)"
        run: >
          python -m pytest -q --tb=line
          --ignore=tests/test_ui_state_machine_fuzz.py
          --ignore=tests/test_ui_driven_fuzz.py
          --deselect "tests/test_payment_confirmation_dialog.py::TestAccessibilityFontSizes"

      - name: "Gate 2: production simulation"
        run: python -m scripts.production_sim

      - name: "Gate 3: v1.9.9 stress simulation"
        run: python -m scripts.v1_9_9_stress_sim

  fuzz:
    name: Fuzz suites
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements-build.lock

      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-build.lock
          pip install pytest==9.0.2 pytest-qt==4.5.0

      # Three seeds are KNOWN failures deferred since v2.0.8 (3–12¢
      # rounding divergences in random 30+ action sequences — see
      # BUGS_BACKLOG.md BUG-006).  Deselected so this job is green
      # unless a NEW fuzz regression appears — which then blocks.
      # When BUG-006 is fixed, remove the deselects.
      - name: UI fuzz suites (3 known seeds deselected)
        run: >
          python -m pytest -q --tb=line
          tests/test_ui_state_machine_fuzz.py
          tests/test_ui_driven_fuzz.py
          --deselect "tests/test_ui_state_machine_fuzz.py::test_fuzz_random_action_sequences[23]"
          --deselect "tests/test_ui_state_machine_fuzz.py::test_fuzz_extended_sequences[1005]"
          --deselect "tests/test_ui_driven_fuzz.py::test_fuzz_extended_ui_actions[105]"

      # The standalone fuzz simulator currently exits 1 on seeds 2 and 5
      # (I5 per-customer match-cap violations — same engine-edge family
      # as the deselected seeds above; BUGS_BACKLOG.md BUG-006).  This
      # also means Gate 4 of the LOCAL release audit gate is currently
      # red.  Informational here until the engine edge is fixed; flip
      # continue-on-error off when BUG-006 closes.
      - name: Fuzz simulator (known-red until BUG-006)
        continue-on-error: true
        run: python -m scripts.fuzz_simulator
