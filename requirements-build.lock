# Pinned BUILD dependencies — exact versions for reproducible signed builds.
#
# Captured via `pip freeze` from the build_venv that produced the signed
# v2.0.9 release binary (2026-06: Python 3.12.2, PyInstaller 6.19.0,
# PySide6 6.10.2).  build.bat installs from THIS file, not requirements.txt.
#
# requirements.txt (loose >= ranges) remains for development installs only.
#
# To upgrade deliberately:
#   1. Update the desired pin(s) here, or recreate build_venv and
#      `pip install -r requirements.txt pyinstaller` to pull latest.
#   2. Build, run the FULL release audit gate (scripts\run_release_audit.bat),
#      and verify the packaged exe launches + syncs before signing.
#   3. Regenerate this file: build_venv\Scripts\python -m pip freeze
#      (then restore this header).
#
# Never let an unpinned `pip install` decide what goes into a signed
# release binary.
